version: "3.9"

services:
  intersight-mcp-server:
    build: .
    container_name: intersight_mcp_server
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./reports:/app/reports
      - ./toolsfile:/app/toolsfile
      - ./logs:/app/logs
      -  ./NSDev01-SecretKey.txt:/app/secret/NSDev01-SecretKey.txt:ro
    restart: unless-stopped
