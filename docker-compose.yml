version: "3.9"

services:
  intersight-mcp-server:
    build: .
    container_name: intersight_mcp_server
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./secret:/app/secret:ro
      - ./reports:/app/reports
      - ./toolsfile:/app/toolsfile
      - ./logs:/app/logs
    restart: unless-stopped
